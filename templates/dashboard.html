<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
margin:0;
background:linear-gradient(180deg,#0f0f0f,#000);
color:white;
font-family:-apple-system;
}

/* TOPBAR */
.topbar{
display:flex;
justify-content:space-between;
padding:15px;
background:rgba(20,20,20,0.7);
backdrop-filter:blur(10px);
}

.logo{
background: linear-gradient(90deg,#00ffae,#00c3ff);
-webkit-background-clip:text;
color:transparent;
font-size:22px;
font-weight:bold;
}

/* CARDS */
.container{
display:flex;
flex-wrap:wrap;
gap:15px;
padding:15px;
}

.card{
flex:1;
min-width:250px;
background:rgba(255,255,255,0.05);
padding:20px;
border-radius:16px;
backdrop-filter:blur(10px);
text-align:center;
box-shadow:0 4px 20px rgba(0,0,0,0.4);
}

.big{
font-size:30px;
margin-top:10px;
}

/* BUTTON */
button{
padding:10px 15px;
border:none;
border-radius:10px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="topbar">
<div class="logo">GYMGENIE ⚡</div>
<a href="/plan"><button style="background:#00ffae;">⬅ Back</button></a>
</div>

<div class="container">

<div class="card">
<h3>🔥 Streak</h3>
<div class="big">{{streak}}</div>
</div>

<div class="card">
<h3>🔥 Calories</h3>
<div class="big">{{calories}}</div>
</div>

</div>

<div class="container">

<div class="card">
<h3>📊 Calories Progress</h3>
<canvas id="calChart"></canvas>
</div>

<div class="card">
<h3>💪 Reps Progress</h3>
<canvas id="repsChart"></canvas>
</div>

</div>

<script>
new Chart(document.getElementById("calChart"), {
type:'line',
data:{
labels:Array.from({length: {{history|length}}}, (_, i) => i+1),
datasets:[{label:'Calories',data:{{history|tojson}}}]
}
});

new Chart(document.getElementById("repsChart"), {
type:'line',
data:{
labels:Array.from({length: {{reps|length}}}, (_, i) => i+1),
datasets:[{label:'Reps',data:{{reps|tojson}}}]
}
});
</script>

</body>
</html>
