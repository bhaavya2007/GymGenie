<!DOCTYPE html>
<html>
<body style="background:#0f0f0f;color:white;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh">

<form method="POST" style="background:#1e1e1e;padding:30px;border-radius:12px;width:300px">

<h2>Create Account</h2>

<input name="email" placeholder="Email" required
style="width:100%;padding:10px;margin:10px 0"><br>

<input name="password" type="password" placeholder="Password" required
style="width:100%;padding:10px;margin:10px 0"><br>

<button type="submit" style="width:100%;padding:10px;background:#00ffae;border:none;border-radius:8px">
Sign Up
</button>

<p style="margin-top:10px">
Already have an account? <a href="/" style="color:#00ffae">Login</a>
</p>

</form>

</body>
</html>
