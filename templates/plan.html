<!DOCTYPE html>
<html>
<head>
    <title>Workout Plan</title>
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 15px;
            margin: 15px 0;
            border-radius: 12px;
        }

        .done {
            background: #16a34a !important;
        }

        iframe {
            border-radius: 10px;
            margin-top: 10px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
        }

        .progress {
            background: #334155;
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-bar {
            background: #22c55e;
            height: 10px;
        }
    </style>
</head>
<body>

<div class="topbar">
    <h2>GymGenie</h2>
    <div>
        <a href="/dashboard">Dashboard</a> |
        <a href="/leaderboard">Leaderboard</a> |
        <a href="/logout">Logout</a>
    </div>
</div>

<h3>Calories: {{ calories }}</h3>

<div class="progress">
    <div class="progress-bar" style="width: {{ percent }}%"></div>
</div>

{% for day in plan %}
    <h3>{{ day.day }}</h3>

    {% for ex in day.exercises %}
        {% set key = loop.index0 ~ '-' ~ loop.index0 %}
        <div class="card {% if key in progress %}done{% endif %}">
            <h4>{{ ex.name }}</h4>
            <p>{{ ex.benefit }}</p>

            <iframe width="100%" height="200"
                src="{{ ex.link }}"
                allowfullscreen>
            </iframe>

            <br><br>
            <a href="/complete/{{ loop.index0 }}/{{ loop.index0 }}">Complete</a>
        </div>
    {% endfor %}
{% endfor %}

<br>
<a href="/posture">Check Form</a>

</body>
</html>
