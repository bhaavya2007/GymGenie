<!DOCTYPE html>
<html>
<head>
<style>
body {
    background:#0f0f0f;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.card {
    background:#1e1e1e;
    padding:30px;
    border-radius:15px;
    width:300px;
    text-align:center;
}
input {
    width:100%;
    padding:10px;
    margin:10px 0;
    border:none;
    border-radius:8px;
}
button {
    width:100%;
    padding:10px;
    background:#00ffae;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
a { color:#00ffae; }
</style>
</head>

<body>

<div class="card">
<h2>Login</h2>

<form method="POST" action="/login">
<input name="email" placeholder="Email">
<input name="password" type="password" placeholder="Password">
<button>Login</button>
</form>

<br>
<a href="/signup">Create Account</a><br>
<a href="/forgot">Forgot Password?</a>

</div>

</body>
</html>
